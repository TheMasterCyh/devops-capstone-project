---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: echo
spec:
  description: This task will echo the message.
  params:
    - name: message
      description: The message to echo
      type: string
  steps:
    - name: echo-message
      image: alpine:3
      command: [/bin/echo]
      args: ["$(params.message)"]

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  description: This task will run flake8 on the provided input.
  workspaces:
    - name: source
  params:
    - name: image
      description: The container image with Python and pip
      type: string
      default: python:3.9-slim
    - name: path
      description: The path to analyse
      type: string
      default: "."
    - name: requirements_file
      description: Requirements file
      type: string
      default: requirements.txt
    - name: args
      description: Arguments to pass to flake8
      type: array
      default: []
  steps:
    - name: flake8
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        export HOME=/tmp/python
        export PATH=$PATH:/tmp/python/.local/bin

        if [ -n "$(params.requirements_file)" ] && \
           [ -e "$(params.requirements_file)" ]; then
          python -m pip install --user -r "$(params.requirements_file)"
        fi

        flake8 "$@" "$(params.path)"
      args:
        - "$(params.args[*])"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tests
spec:
  description: This task will run nosetests on the provided input.
  workspaces:
    - name: source
  params:
    - name: args
      description: The arguments to pass to the nose CLI
      type: string
      default: -v
    - name: database_uri
      description: Database connection string of test database
      type: string
      default: sqlite:///test.db
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
      script: |
        #!/bin/bash
        set -e
        echo "**** Installing dependencies ****"
        python -m pip install --upgrade pip wheel
        pip install -qr requirements.txt
        echo "**** Running nosetests with: $(params.args) ****"
        nosetests $(params.args)
